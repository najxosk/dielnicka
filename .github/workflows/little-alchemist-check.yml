name: Little Alchemist checks
on:
  push:
    branches: [little-alchemist-v1]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: node --check little-alchemist-v1.js
      - name: Required files and branding
        run: |
          test -s index.html
          test -s little-alchemist-v1.css
          test -s little-alchemist-v1.js
          grep -q "Little Alchemist" index.html
          grep -q "Array.from({length:50}" little-alchemist-v1.js
