name: Little Alchemist checks
on:
  push:
    branches: [main, little-alchemist-stability, little-alchemist-v1.2]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Syntax, content diversity and independent level solver
        run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Gameplay, progress, SK/EN and mobile layouts
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: test-results/
      - name: Required files and branding
        run: |
          test -s index.html
          test -s little-alchemist-v1.css
          test -s app.js
          grep -q "Little Alchemist" index.html
          grep -q "Array.from({length:50}" app.js
          ! grep -qi "Dielnička" index.html
      - name: Basic content checks
        run: |
          grep -q "const CHEM" app.js
          grep -q "const CATS" app.js
          grep -q "Level validation failed" app.js
          grep -q "localDay" app.js
