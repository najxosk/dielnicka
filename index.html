<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dielnička — tehla</title>
<style>
  :root{
    --bg:#1a1310; --bg2:#241a15; --panel:#2e211a; --line:#4a352a;
    --sand:#e8d5b7; --fire:#e8743b; --ok:#8fbf5a; --bad:#c9584a; --text:#f0e3d3;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -20%, #3a2820 0%, transparent 70%),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.012) 0 2px, transparent 2px 6px),
      var(--bg);
    color:var(--text); font-family:"Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    display:flex; align-items:center; justify-content:center; user-select:none;
  }
  #app{width:100%; max-width:520px; height:100%; display:flex; flex-direction:column; gap:8px; padding:10px 12px 14px;}

  #hud{display:grid; grid-template-columns:repeat(3,1fr) auto auto; gap:6px;
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px 10px;}
  .hud-item{display:flex; flex-direction:column; align-items:center; line-height:1.1;}
  .hud-item .lbl{font-size:10px; letter-spacing:1px; text-transform:uppercase; color:#a08a75;}
  .hud-item b{font-size:19px; font-variant-numeric:tabular-nums;}
  #time.low{color:var(--bad); animation:pulse .7s infinite;}
  @keyframes pulse{50%{opacity:.4}}
  .iconbtn{background:transparent; border:1px solid var(--line); color:var(--text);
    border-radius:8px; font-size:15px; width:36px; cursor:pointer; height:100%; min-height:34px;}
  .iconbtn:active{background:#3b2b20;}

  #goal{display:flex; align-items:center; gap:12px; background:var(--panel);
    border:1px solid var(--line); border-radius:12px; padding:9px 12px;}
  #goal .ge{font-size:30px;}
  #goal .gt{display:flex; flex-direction:column; line-height:1.25;}
  #goal .gt small{font-size:10px; letter-spacing:1.2px; text-transform:uppercase; color:#a08a75;}
  #goal .gt span{font-size:15.5px; font-weight:600;}
  #goal .gt em{font-size:11.5px; color:#8f7c6b; font-style:normal;}

  #toast{min-height:34px; text-align:center; font-size:13.5px; color:#cdbba6;
    display:flex; align-items:center; justify-content:center; padding:0 4px; line-height:1.3;}
  #toast.good{color:var(--ok);} #toast.bad{color:var(--bad);}

  #board{flex:0 0 auto; display:grid; grid-template-columns:repeat(3,1fr); grid-auto-rows:minmax(0,1fr);
    gap:8px; background:linear-gradient(180deg,#2a1e17,#221810); border:1px solid var(--line);
    border-radius:14px; padding:10px; touch-action:none; max-height:46vh; aspect-ratio:3/2;}
  .cell{position:relative; border-radius:11px; background:linear-gradient(180deg,#2b1f18,#241a14);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.03); display:flex; align-items:center; justify-content:center;
    transition:box-shadow .12s, background .12s; overflow:hidden;}
  .cell.sel{box-shadow:inset 0 0 0 2px var(--sand); background:linear-gradient(180deg,#3b2b20,#2c2018);}
  .cell.empty{background:repeating-linear-gradient(45deg,#241a14 0 8px,#261b15 8px 16px);}
  .tile{position:absolute; inset:3px; border-radius:10px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; font-size:min(9vw,40px); cursor:pointer;
    border:1px solid rgba(0,0,0,.35); animation:pop .18s ease-out;}
  .tile span{font-size:10px; letter-spacing:.3px; color:rgba(0,0,0,.6); margin-top:2px; font-weight:700;}
  @keyframes pop{from{transform:scale(.72); opacity:.2} to{transform:scale(1); opacity:1}}
  .tile.bump{animation:bump .34s cubic-bezier(.3,1.6,.5,1);}
  @keyframes bump{0%{transform:scale(1)} 45%{transform:scale(1.14)} 100%{transform:scale(1)}}
  #board.shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(3px)}}
  .t-hlina{background:linear-gradient(180deg,#c07a4c,#9b5a33);}
  .t-voda{background:linear-gradient(180deg,#6fb2d6,#3f7fa6);}
  .t-slama{background:linear-gradient(180deg,#e6cd76,#c2a43f);}
  .t-piesok{background:linear-gradient(180deg,#e3d9a8,#c3b478);}
  .t-popol{background:linear-gradient(180deg,#9a9490,#6d6864);}
  .t-kamen{background:linear-gradient(180deg,#a8a29b,#7b756f);}
  .t-blato{background:linear-gradient(180deg,#8a6a52,#5d4433);}
  .t-cesto{background:linear-gradient(180deg,#d9a15e,#b8763a); box-shadow:0 0 14px rgba(232,116,59,.5);}
  .t-odpad{background:linear-gradient(180deg,#6d6a66,#46433f); color:#ded8d2;}
  .t-odpad span{color:rgba(255,255,255,.62);}

  #hint{font-size:11.5px; color:#8f7c6b; text-align:center; line-height:1.45;}

  #overlay{position:fixed; inset:0; background:rgba(12,8,6,.86); backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; padding:16px; z-index:20;}
  #overlay.hidden{display:none;}
  .panel{width:100%; max-width:430px; max-height:92vh; overflow:auto;
    background:linear-gradient(180deg,#33241c,#261a14); border:1px solid var(--line);
    border-radius:16px; padding:20px; box-shadow:0 18px 50px rgba(0,0,0,.6);}
  .panel h1{margin:0 0 4px; font-size:23px; letter-spacing:.5px;}
  .panel h2{margin:0 0 10px; font-size:20px;}
  .panel h2.lost{color:var(--bad);}
  .sub{color:#a08a75; font-size:12.5px; margin-bottom:14px;}
  .rules{list-style:none; padding:0; margin:0 0 16px; font-size:14px; line-height:1.8;}
  .rules li{padding-left:22px; position:relative;}
  .rules li:before{content:"›"; position:absolute; left:6px; color:var(--fire);}
  .kv{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed var(--line); font-size:14px;}
  .kv b{font-variant-numeric:tabular-nums;}
  .kv.total{border-bottom:none; font-size:16px; padding-top:10px;}
  .kv.total b{color:var(--ok); font-size:20px;}
  .card{margin:14px 0; padding:12px 14px; border-left:3px solid var(--fire);
    background:rgba(232,116,59,.08); border-radius:0 10px 10px 0; font-size:13.5px; line-height:1.6;}
  .card .t{font-size:10.5px; letter-spacing:1.4px; text-transform:uppercase; color:var(--fire);
    display:block; margin-bottom:5px;}
  .card.bad{border-left-color:var(--bad); background:rgba(201,88,74,.1);}
  .card.bad .t{color:var(--bad);}
  button.big{width:100%; padding:14px; margin-top:8px; border:none; border-radius:12px; cursor:pointer;
    background:linear-gradient(180deg,#e8743b,#c4552a); color:#fff; font-size:16.5px; font-weight:700;
    letter-spacing:.5px; box-shadow:0 6px 0 #8e3c1c;}
  button.big:active{transform:translateY(2px); box-shadow:0 4px 0 #8e3c1c;}
  #fx{position:fixed; inset:0; pointer-events:none; z-index:30;}
  .float{position:fixed; font-weight:800; font-size:22px; pointer-events:none; z-index:40;
    animation:float 1s ease-out forwards; text-shadow:0 2px 6px rgba(0,0,0,.7);}
  @keyframes float{to{transform:translateY(-46px); opacity:0;}}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="hud-item"><span class="lbl">Čas</span><b id="time">90</b></div>
    <div class="hud-item"><span class="lbl">Skóre</span><b id="score">0</b></div>
    <div class="hud-item"><span class="lbl">Rekord</span><b id="best">0</b></div>
    <button class="iconbtn" id="restart" title="Reštart kola">↺</button>
    <button class="iconbtn" id="mute" title="Zvuk">🔈</button>
  </div>
  <div id="goal">
    <div class="ge" id="goalEmoji">🧱</div>
    <div class="gt">
      <small>Vyrob</small>
      <span id="goalName">tehlu</span>
      <em id="goalHint">Nie všetko na stole je potrebné.</em>
    </div>
  </div>
  <div id="toast">Ťukni na jednu vec, potom na druhú — spoja sa.</div>
  <div id="board"></div>
  <div id="hint">Zlá zmes sa nedá opraviť — kolo potom nedokončíš a musíš ho spustiť znova.</div>
</div>
<div id="overlay"><div class="panel" id="panel"></div></div>
<canvas id="fx"></canvas>

<script>
(function(){
"use strict";

/* ================= VECI ================= */
var ING = {
  hlina:  {emoji:"🟤", label:"hlína",      cls:"t-hlina"},
  voda:   {emoji:"💧", label:"voda",       cls:"t-voda"},
  slama:  {emoji:"🌾", label:"slama",      cls:"t-slama"},
  piesok: {emoji:"🟨", label:"piesok",     cls:"t-piesok"},
  popol:  {emoji:"⬜", label:"popol",      cls:"t-popol"},
  kamen:  {emoji:"🪨", label:"kamienok",   cls:"t-kamen"},
  blato:  {emoji:"🟫", label:"blato",      cls:"t-blato"},
  cesto:  {emoji:"🟠", label:"cesto",      cls:"t-cesto"},
  odpad:  {emoji:"⬛", label:"nepodarok",  cls:"t-odpad"}
};

/* ================= ÚROVNE =================
   Surovín je na stole viac, než treba. Hráč musí prísť na to, z čoho sa vec skladá.
   Každý pár, ktorý nie je v "recepty", spraví nepodarok a kolo sa tým pokazí. */
var LEVELS = [
  {
    cislo: 1,
    ciel: "tehla",
    cielEmoji: "🧱",
    cielNazov: "tehlu",
    napoveda: "Nie všetko na stole je potrebné.",
    cas: 90,
    stol: ["hlina","voda","slama","piesok","popol","kamen"],
    recepty: {
      "hlina+voda": "blato",
      "blato+slama": "cesto"
    },
    vypalit: {cesto: "tehla"},
    fakty: [
      "Hlína + voda vytvorí tvárnu hmotu. Bez vody sa suchá hlina rozsype na prach.",
      "Slama v tehle je výstuž — drží ju pokope, aby pri sušení nepraskla. Dnešná obdoba je armovacia sieť v betóne.",
      "Tehla sa vypaľuje okolo 1000 °C. Vypálením sa hlina zmení na keramiku: tvrdú a nerozpustnú vo vode.",
      "Piesok v hline tehlu oslabí — preto sa tehliarska hlina triedi, aby piesku bolo čo najmenej.",
      "Popol sa do tehly nepridáva. Kedysi sa ním ale hnojilo pole — bol to vzácny zdroj živín."
    ]
  }
];

/* čo povie hra, keď spojíš dvojicu, z ktorej nič nie je */
var ZLE = {
  "hlina+piesok":"Piesok s hlinou bez vody sa rozsype.",
  "hlina+popol":"Popol s hlinou nedrží — je to len šedá kaša.",
  "hlina+kamen":"Kamienok sa s hlinou nespojí.",
  "hlina+hlina":"Samotná hlina bez vody nedrží.",
  "voda+piesok":"Z vody a piesku je len mokrý piesok.",
  "voda+popol":"Popol vo vode sa rozmočí na kal.",
  "voda+kamen":"Kamienok sa vo vode len namočí.",
  "voda+voda":"Voda s vodou nič nestavia.",
  "slama+piesok":"Slama s pieskom nič nestavia.",
  "slama+popol":"Zo slamy a popola nič nie je.",
  "slama+kamen":"Slama s kamienkom nedrží.",
  "slama+slama":"Slama sama nedrží tvar.",
  "piesok+popol":"Piesok s popolom je len prach.",
  "piesok+kamen":"Piesok s kamienkom nič.",
  "popol+kamen":"Z popola a kamienka nič nie je.",
  "piesok+piesok":"Piesok s pieskom je len viac piesku.",
  "popol+popol":"Popol s popolom je len viac popola.",
  "kamen+kamen":"Kamienky sa samy nespoja.",
  "blato+blato":"Blato s blatom je len viac blata — treba slamu.",
  "blato+piesok":"Blato s pieskom sa rozpadne.",
  "blato+popol":"Blato s popolom nedrží.",
  "blato+kamen":"Blato s kamienkom nič.",
  "blato+hlina":"Blato s ďalšou hlinou je len hustejšie blato.",
  "blato+voda":"Priveľa vody blato rozmočí.",
  "cesto+blato":"Cesto s blatom sa rozpadne.",
  "cesto+hlina":"Cesto už hlinu má — viac jej ho rozbije.",
  "cesto+voda":"Priveľa vody cesto rozmáča.",
  "cesto+slama":"Cesto už slamu má — druhá dávka ho rozbije.",
  "cesto+piesok":"Piesok cesto oslabí.",
  "cesto+popol":"Popol cesto znečistí.",
  "cesto+kamen":"Kamienok cesto len roztrhne.",
  "cesto+cesto":"Dve cestá sa nedajú spojiť — jedno musíš vypáliť."
};
function zlaVeta(k){
  if(ZLE[k]) return ZLE[k];
  var p = k.split("+");
  return ING[p[0]].label + " a " + ING[p[1]].label + " spolu nedržia.";
}

/* ================= STAV ================= */
var N = 6;
var lvl, tiles, selected, running, lost, solved, timeLeft, levelScore, attempt, tickTimer;
var score = 0, best = 0, muted = false;
var $ = function(id){ return document.getElementById(id); };
var boardEl = $("board"), toastEl = $("toast");

/* ================= ZVUK ================= */
var actx = null;
function initAudio(){ if(actx) return; try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; } }
function sfx(freq, dur, type, vol){
  if(muted || !actx) return;
  try{
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type||"sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(vol||0.12, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
  }catch(e){}
}
function sfxMerge(){ sfx(520,0.09,"triangle",0.10); setTimeout(function(){sfx(780,0.10,"triangle",0.09);},70); }
function sfxFire(){ sfx(300,0.16,"sawtooth",0.09); setTimeout(function(){sfx(880,0.24,"triangle",0.11);},90); }
function sfxBad(){ sfx(190,0.18,"square",0.08); setTimeout(function(){sfx(120,0.26,"square",0.07);},150); }
function sfxWin(){ [523,659,784,1046].forEach(function(f,i){ setTimeout(function(){sfx(f,0.28,"triangle",0.09);}, i*130); }); }

/* ================= POMOCNÉ ================= */
function key(a,b){ return a<b ? a+"+"+b : b+"+"+a; }
function rand(a){ return Math.floor(Math.random()*a); }
function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){ var j=rand(i+1); var t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
  return arr;
}
function toast(msg, kind){ toastEl.textContent = msg; toastEl.className = kind || ""; }
function floatText(txt, color){
  var d = document.createElement("div");
  d.className="float"; d.textContent=txt; d.style.color=color;
  d.style.left=(window.innerWidth/2-30)+"px"; d.style.top=(window.innerHeight*0.40)+"px";
  document.body.appendChild(d); setTimeout(function(){ d.remove(); },1000);
}

/* ================= VYKRESLENIE =================
   Zámerne NEprekresľujeme plochu odznova cez innerHTML. Predtým sa tým
   dlaždice každú sekundu znovu vytvárali a ich animácia sa spúšťala znova
   — preto to blikalo. Teraz sa menia len tie dlaždice, ktoré sa naozaj zmenili. */
var cellEls = [], tileEls = [];

function buildBoard(){
  boardEl.innerHTML = "";
  cellEls = []; tileEls = [];
  for(var i=0;i<N;i++){
    var cell = document.createElement("div");
    cell.className = "cell empty";
    cell.dataset.i = i;
    boardEl.appendChild(cell);
    cellEls.push(cell); tileEls.push(null);
  }
}

function paint(){
  for(var i=0;i<N;i++){
    var t = tiles[i], cell = cellEls[i], tile = tileEls[i];
    if(!cell) continue;
    if(selected===i) cell.classList.add("sel"); else cell.classList.remove("sel");
    if(!t){
      cell.classList.add("empty");
      if(tile){ tile.remove(); tileEls[i] = null; }
      continue;
    }
    cell.classList.remove("empty");
    if(!tile || tile.dataset.type !== t){
      if(tile) tile.remove();
      tile = document.createElement("div");
      tile.className = "tile " + ING[t].cls;
      tile.dataset.type = t;
      tile.innerHTML = ING[t].emoji + "<span>" + ING[t].label + "</span>";
      cell.appendChild(tile);
      tileEls[i] = tile;
    }else{
      tile.classList.remove("bump");
    }
  }
}

function bump(i){
  var tile = tileEls[i];
  if(!tile) return;
  tile.classList.remove("bump");
  void tile.offsetWidth;      /* donúti prehliadač animáciu prehrať znova */
  tile.classList.add("bump");
}

function hud(){
  $("score").textContent = score;
  $("best").textContent = best;
  $("time").textContent = timeLeft;
  if(timeLeft<=10) $("time").className = "low"; else $("time").className = "";
}
function render(){ paint(); hud(); }

/* ================= ŤUKNUTIE ================= */
function tap(i){
  if(!running) return;
  var t = tiles[i];

  if(t === "cesto"){ fire(i); return; }
  if(t === "odpad"){
    toast("Toto je nepodarok — nedá sa použiť.", "bad");
    return;
  }
  if(t === null){
    if(selected!==null && tiles[selected]){
      tiles[i] = tiles[selected]; tiles[selected] = null; selected = null;
      sfx(430,0.05,"sine",0.05); render();
      return;
    }
    selected = null; render(); return;
  }
  if(selected === null){ selected = i; render(); return; }
  if(selected === i){ selected = null; render(); return; }
  combine(selected, i);
}

function combine(a,b){
  var x = tiles[a], y = tiles[b];
  selected = null;
  if(!x || !y){ render(); return; }
  var k = key(x,y);
  var res = lvl.recepty[k];

  if(res){
    tiles[a] = res; tiles[b] = null;
    levelScore += 25;
    sfxMerge();
    toast(ING[x].label + " + " + ING[y].label + " = " + ING[res].label + "  (+25)", "good");
    paint();
    bump(a);
    return;
  }

  /* ZLÁ ZMES — kolo je pokazené */
  tiles[a] = "odpad"; tiles[b] = null;
  badMerge(key(x,y));
}

function badMerge(k){
  var p = k.split("+");
  lost = true; running = false;
  clearInterval(tickTimer);
  sfxBad();
  toast("Zlá zmes: " + ING[p[0]].label + " + " + ING[p[1]].label + " = nepodarok.", "bad");
  render();
  boardEl.classList.add("shake");
  setTimeout(function(){ boardEl.classList.remove("shake"); }, 420);
  setTimeout(function(){ showLost(k); }, 900);
}

/* ================= VYPÁLENIE ================= */
function fire(i){
  if(!running || tiles[i] !== "cesto") return;
  tiles[i] = null;
  solved = true; running = false;
  clearInterval(tickTimer);
  levelScore += 100 + timeLeft*2 - (attempt-1)*25;
  if(levelScore < 50) levelScore = 50;
  score = levelScore;
  if(score > best){ best = score; localStorage.setItem("dielnicka_rekord", String(score)); }
  sfxFire();
  floatText("+" + levelScore, "#8fbf5a");
  render();
  finalScene(function(){ showWin(); });
}

/* ================= KOLO ================= */
function startLevel(){
  lvl = LEVELS[0];
  tiles = shuffle(lvl.stol.slice());
  selected = null; lost = false; solved = false; running = true;
  levelScore = 0; timeLeft = lvl.cas;
  score = 0;
  $("goalEmoji").textContent = lvl.cielEmoji;
  $("goalName").textContent = lvl.cielNazov;
  $("goalHint").textContent = lvl.napoveda;
  toast("Z čoho sa " + lvl.ciel + " skladá?", "");
  render();
  $("overlay").classList.add("hidden");
  clearInterval(tickTimer);
  tickTimer = setInterval(function(){
    if(!running) return;
    timeLeft--;
    hud();                 /* len čísla — plocha sa už prekresľovať nemusí */
    if(timeLeft <= 0){ timeUp(); }
  }, 1000);
}
function restartLevel(voluntary){
  attempt++;
  startLevel();
  if(voluntary) toast("Nový pokus — suroviny sú nasypané odznova.", "");
}

function timeUp(){
  running = false; lost = true;
  clearInterval(tickTimer);
  sfxBad();
  showLost(null, true);
}

/* ================= KONCOVÁ ANIMÁCIA ================= */
function finalScene(done){
  var cv = $("fx"), ctx = cv.getContext("2d");
  var W = cv.width = window.innerWidth, H = cv.height = window.innerHeight;
  var t0 = performance.now(), finished = false;
  var b = { x: W/2 - 36, y: -60, w: 72, h: 30, rot: (Math.random()-0.5)*0.12, vy: 0, landed: false };
  var groundY = H*0.52;
  function finish(){ if(finished) return; finished = true; try{ ctx.clearRect(0,0,W,H); }catch(e){} done(); }
  setTimeout(finish, 4500); /* poistka, keby prehliadač animáciu pozastavil */
  function step(){
    var el = performance.now() - t0;
    ctx.clearRect(0,0,W,H);
    if(!b.landed){
      b.vy += 0.9; b.y += b.vy;
      if(b.y >= groundY){ b.y = groundY; b.landed = true; }
    }
    if(el > 250){ drawBrick(ctx, b); }
    if(b.landed && el > 900){ setTimeout(finish, 350); return; }
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function drawBrick(ctx, b){
  ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot);
  var g = ctx.createLinearGradient(0,0,0,b.h);
  g.addColorStop(0,"#c07a4c"); g.addColorStop(1,"#8e4f2b");
  ctx.fillStyle = g; ctx.fillRect(0,0,b.w,b.h);
  ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.lineWidth = 1.5; ctx.strokeRect(0.5,0.5,b.w-1,b.h-1);
  ctx.restore();
}

/* ================= OBRAZOVKY ================= */
function showWin(){
  sfxWin();
  var f = lvl.fakty[rand(lvl.fakty.length)];
  var casBonus = timeLeft*2, pokuta = (attempt-1)*25;
  $("panel").innerHTML =
    '<h2>🧱 ' + lvl.ciel.charAt(0).toUpperCase() + lvl.ciel.slice(1) + ' je hotová</h2>'+
    '<div class="sub">Kolo ' + lvl.cislo + ' · pokusov: ' + attempt + '</div>'+
    '<div class="kv"><span>Za vypálenie</span><b>+100</b></div>'+
    '<div class="kv"><span>Zvyšný čas (' + timeLeft + ' s × 2)</span><b>+' + casBonus + '</b></div>'+
    (pokuta ? '<div class="kv"><span>Za ' + (attempt-1) + ' opakovan' + (attempt-1===1?"ie":"ia") + '</span><b>−' + pokuta + '</b></div>' : '')+
    '<div class="kv total"><span>Skóre</span><b>' + levelScore + '</b></div>'+
    '<div class="card"><span class="t">Prečo to drží</span>Tehla = hlina + voda + slama, vypálená pri 1000 °C. Slama je výstuž, voda robí hlinu tvárnou. Presne takto sa tehly robia 5000 rokov.</div>'+
    '<div class="card"><span class="t">Vedel si?</span>' + f + '</div>'+
    '<button class="big" id="again">Skúsiť znova (rýchlejšie)</button>';
  $("overlay").classList.remove("hidden");
  $("again").onclick = function(){ attempt++; initAudio(); startLevel(); };
  running = false;
}

function showLost(k, timeOut){
  var telo = timeOut
    ? 'Čas vypršal, kým si prišiel na to, z čoho sa <b>' + lvl.ciel + '</b> skladá.'
    : 'Spojil si <b>' + (k ? ING[k.split("+")[0]].label + ' + ' + ING[k.split("+")[1]].label : '') + '</b> — vznikol nepodarok. ' +
      'Surovina je minutá, takže <b>' + lvl.ciel + '</b> už z toho nevyrobíš.';
  var rada = timeOut
    ? 'Na stole je viac surovín, než treba. Skús si najprv v hlave povedať, čo všetko by ' + lvl.ciel + ' potrebovala.'
    : 'Zlá zmes sa nedá vrátiť späť. Radšej si najprv premysli, ktoré dve veci k sebe patria.';
  $("panel").innerHTML =
    '<h2 class="lost">' + (timeOut ? '⏱ Čas vypršal' : '✖ Kolo je stratené') + '</h2>'+
    '<div class="sub">Kolo ' + lvl.cislo + ' · pokus ' + attempt + '</div>'+
    '<div class="card bad"><span class="t">' + (k ? 'Zlý postup' : 'Prečo') + '</span>' + telo + '</div>'+
    '<div class="card"><span class="t">Rada</span>' + rada + '</div>'+
    '<button class="big" id="retry">Spustiť kolo znova</button>';
  $("overlay").classList.remove("hidden");
  $("retry").onclick = function(){ initAudio(); restartLevel(true); };
}

function showIntro(){
  best = Number(localStorage.getItem("dielnicka_rekord")||0);
  $("best").textContent = best;
  $("panel").innerHTML =
    '<h1>🧱 Dielnička</h1>'+
    '<div class="sub">Kolo 1: vyrob tehlu.</div>'+
    '<ul class="rules">'+
      '<li>Na stole máš suroviny. <b>Nie všetky potrebuješ.</b></li>'+
      '<li>Ťukni na jednu vec, potom na druhú — spoja sa.</li>'+
      '<li>Príď na to, z čoho sa tehla skladá, a vypáli ju.</li>'+
      '<li><b>Zlá zmes = koniec kola.</b> Vznikne nepodarok a kolo už nedokončíš.</li>'+
      '<li>Za kolo dostaneš body: viac za rýchlosť, menej za opakovanie.</li>'+
    '</ul>'+
    '<div class="card"><span class="t">Pravidlo hry</span>O výsledku rozhoduje <b>recept</b>, nie náhoda. Fyzika na konci je len ukážka toho, čo si poskladal.</div>'+
    '<button class="big" id="play">Začať kolo (90 sekúnd)</button>';
  $("overlay").classList.remove("hidden");
  $("play").onclick = function(){ initAudio(); startLevel(); };
}

/* ================= OVLÁDANIE ================= */
/* Reagujeme priamo na pointerup — funguje rovnako pre prst aj myš. */
boardEl.addEventListener("pointerup", function(e){
  var el = e.target.closest ? e.target.closest(".cell") : null;
  if(!el) return;
  e.preventDefault();
  tap(Number(el.dataset.i));
});
boardEl.addEventListener("pointerdown", function(e){ e.preventDefault(); });
boardEl.addEventListener("touchstart", function(e){ e.preventDefault(); }, {passive:false});
$("mute").addEventListener("click", function(){
  muted = !muted; $("mute").textContent = muted ? "🔇" : "🔈";
});
$("restart").addEventListener("click", function(){
  if(!running && !lost) return;
  initAudio(); restartLevel(true);
});

/* ladenie / testovanie */
window.DIELNICKA = {
  get: function(){
    return {tiles:tiles, selected:selected, running:running, lost:lost, solved:solved,
            timeLeft:timeLeft, levelScore:levelScore, score:score, best:best, attempt:attempt};
  },
  tap: function(i){ tap(i); },
  set: function(i,v){ tiles[i]=v; render(); },
  start: function(){ initAudio(); attempt=1; startLevel(); },
  restart: function(){ restartLevel(true); }
};

/* ================= ŠTART ================= */
attempt = 1; tiles = []; selected = null; running = false; lost = false; solved = false;
timeLeft = LEVELS[0].cas; levelScore = 0;
best = Number(localStorage.getItem("dielnicka_rekord")||0);
buildBoard();
render();
showIntro();

})();
</script>
</body>
</html>
