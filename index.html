<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dielnička</title>
<style>
  :root{
    --bg:#1a1310; --panel:#2e211a; --line:#4a352a; --sand:#e8d5b7;
    --fire:#e8743b; --ok:#8fbf5a; --bad:#c9584a; --text:#f0e3d3; --gold:#e8c33b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -20%, #3a2820 0%, transparent 70%),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.012) 0 2px, transparent 2px 6px),
      var(--bg);
    color:var(--text); font-family:"Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    display:flex; align-items:center; justify-content:center; user-select:none;
  }
  #app{width:100%; max-width:520px; height:100%; display:flex; flex-direction:column; gap:7px; padding:9px 12px 12px;}

  #hud{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:7px 10px;}
  #hudTop{display:grid; grid-template-columns:repeat(3,1fr); gap:6px;}
  .hud-item{display:flex; flex-direction:column; align-items:center; line-height:1.1;}
  .hud-item .lbl{font-size:9.5px; letter-spacing:1px; text-transform:uppercase; color:#a08a75;}
  .hud-item b{font-size:18px; font-variant-numeric:tabular-nums;}
  #time.low{color:var(--bad); animation:pulse .8s infinite;}
  @keyframes pulse{50%{opacity:.45}}
  #hudBottom{display:flex; align-items:center; gap:6px; margin-top:6px;}
  .lvlchip{font-size:10.5px; color:#a08a75; letter-spacing:.2px; flex:1; min-width:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .iconbtn{background:transparent; border:1px solid var(--line); color:var(--text);
    border-radius:8px; font-size:14px; min-width:33px; height:29px; cursor:pointer; padding:0 4px;}
  .iconbtn:active{background:#3b2b20;}

  #goal{display:flex; align-items:center; gap:10px; background:var(--panel);
    border:1px solid var(--line); border-radius:12px; padding:8px 11px; height:70px; overflow:hidden;}
  #goal .ge{font-size:27px;}
  #goal .gt{display:flex; flex-direction:column; line-height:1.25; min-width:0;}
  #goal .gt small{font-size:9.5px; letter-spacing:1.2px; text-transform:uppercase; color:var(--fire);}
  #goal .gt span{font-size:14.5px; font-weight:600;}
  #goal .gt em{font-size:11px; color:#8f7c6b; font-style:normal;}

  #toast{height:54px; overflow:hidden; text-align:center; font-size:13px; color:#cdbba6;
    display:flex; align-items:center; justify-content:center; padding:0 4px; line-height:1.3;}
  #toast.good{color:var(--ok);} #toast.bad{color:var(--bad);}

  #board{flex:0 0 auto; display:grid; gap:7px; background:linear-gradient(180deg,#2a1e17,#221810);
    border:1px solid var(--line); border-radius:14px; padding:9px; touch-action:none;
    aspect-ratio:1/1; max-height:50vh; align-self:center; width:100%; max-width:420px;}
  .cell.fireable{box-shadow:inset 0 0 0 2px rgba(232,116,59,.6);}
  .cell.fireable:after{content:"🔥"; position:absolute; right:4px; bottom:3px; font-size:11px; opacity:.9;}
  #board.shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(3px)}}
  .cell{position:relative; border-radius:11px; background:linear-gradient(180deg,#2b1f18,#241a14);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.03); display:flex; align-items:center; justify-content:center;
    transition:box-shadow .12s, background .12s; overflow:hidden;}
  .cell.sel{box-shadow:inset 0 0 0 3px var(--sand); background:linear-gradient(180deg,#3b2b20,#2c2018);}
  .cell.empty{background:repeating-linear-gradient(45deg,#241a14 0 7px,#261b15 7px 14px);}
  .tile{position:absolute; inset:3px; border-radius:10px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; font-size:min(8vw,34px); cursor:pointer;
    border:1px solid rgba(0,0,0,.35); animation:pop .18s ease-out;}
  .tile span{font-size:9.5px; letter-spacing:.2px; color:rgba(0,0,0,.62); margin-top:1px; font-weight:700;}
  .tile i{position:absolute; top:3px; right:4px; font-style:normal; font-size:9.5px; font-weight:800;
    background:rgba(0,0,0,.42); color:#ffe9c9; border-radius:6px; padding:1px 4px;}
  @keyframes pop{from{transform:scale(.72); opacity:.2} to{transform:scale(1); opacity:1}}
  .tile.bump{animation:bump .34s cubic-bezier(.3,1.6,.5,1);}
  @keyframes bump{0%{transform:scale(1)} 45%{transform:scale(1.14)} 100%{transform:scale(1)}}
  .t-hlina{background:linear-gradient(180deg,#c07a4c,#9b5a33);}
  .t-voda{background:linear-gradient(180deg,#6fb2d6,#3f7fa6);}
  .t-slama{background:linear-gradient(180deg,#e6cd76,#c2a43f);}
  .t-piesok{background:linear-gradient(180deg,#e3d9a8,#c3b478);}
  .t-popol{background:linear-gradient(180deg,#c9c5c0,#8e8a85);}
  .t-kamen{background:linear-gradient(180deg,#a8a29b,#7b756f);}
  .t-vapenec{background:linear-gradient(180deg,#f2f0ec,#c8c4be);}
  .t-cement{background:linear-gradient(180deg,#eae6e0,#b9b3ab);}
  .t-uhlie{background:linear-gradient(180deg,#5a5653,#2f2c2a); color:#f0e3d3;}
  .t-uhlie span{color:rgba(255,255,255,.65);}
  .t-cin{background:linear-gradient(180deg,#d9dde0,#9aa1a6);}
  .t-ruda1{background:linear-gradient(180deg,#e0a067,#b06a35);}
  .t-ruda2{background:linear-gradient(180deg,#9ab6cf,#5f7f9c);}
  .t-blato{background:linear-gradient(180deg,#8a6a52,#5d4433);}
  .t-cesto{background:linear-gradient(180deg,#d9a15e,#b8763a); box-shadow:0 0 14px rgba(232,116,59,.5);}
  .t-kasa{background:linear-gradient(180deg,#d5d1cb,#a29d96);}
  .t-malta{background:linear-gradient(180deg,#bdb6ad,#8a837a);}
  .t-zasyp{background:linear-gradient(180deg,#7b736b,#4e4841); color:#f0e3d3;}
  .t-zasyp span{color:rgba(255,255,255,.65);}
  .t-zasyp2{background:linear-gradient(180deg,#6b7580,#454e56); color:#f0e3d3;}
  .t-zasyp2 span{color:rgba(255,255,255,.65);}
  .t-beton{background:linear-gradient(180deg,#8e8b87,#5c5a57);}
  .t-zmes{background:linear-gradient(180deg,#e2d59b,#b3a266);}
  .t-sklovina{background:linear-gradient(180deg,#9fd0dd,#5f9cb0);}
  .t-vapno1{background:linear-gradient(180deg,#f4f2ee,#cfcac3);}
  .t-vapno2{background:linear-gradient(180deg,#fbfaf8,#ddd9d3);}
  .t-med{background:linear-gradient(180deg,#e0954f,#b56a2c);}
  .t-bronz{background:linear-gradient(180deg,#c9a06a,#8c6535);}
  .t-zelezo{background:linear-gradient(180deg,#9aa3ab,#5d666e);}
  .t-ocel{background:linear-gradient(180deg,#b9c3cb,#7c868f);}
  .t-tehla{background:linear-gradient(180deg,#c07a4c,#8e4f2b);}
  .t-sklo{background:linear-gradient(180deg,#bfe6f0,#7fb9cc); color:#123;}
  .t-odpad{background:linear-gradient(180deg,#6d6a66,#46433f); color:#ded8d2;}
  .t-odpad span{color:rgba(255,255,255,.62);}

  #hint{font-size:11px; color:#8f7c6b; text-align:center; line-height:1.4;}

  #overlay{position:fixed; inset:0; background:rgba(12,8,6,.88); backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; padding:14px; z-index:20;}
  #overlay.hidden{display:none;}
  .panel{width:100%; max-width:440px; max-height:94vh; overflow:auto;
    background:linear-gradient(180deg,#33241c,#261a14); border:1px solid var(--line);
    border-radius:16px; padding:18px; box-shadow:0 18px 50px rgba(0,0,0,.6);}
  .panel h1{margin:0 0 4px; font-size:22px;}
  .panel h2{margin:0 0 8px; font-size:19px;}
  .panel h2.lost{color:var(--bad);}
  .sub{color:#a08a75; font-size:12.5px; margin-bottom:12px;}
  .rules{list-style:none; padding:0; margin:0 0 14px; font-size:13.5px; line-height:1.75;}
  .rules li{padding-left:20px; position:relative;}
  .rules li:before{content:"›"; position:absolute; left:5px; color:var(--fire);}
  .kv{display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px dashed var(--line); font-size:13.5px;}
  .kv b{font-variant-numeric:tabular-nums;}
  .kv.total{border-bottom:none; font-size:15.5px; padding-top:9px;}
  .kv.total b{color:var(--ok); font-size:19px;}
  .card{margin:12px 0; padding:11px 13px; border-left:3px solid var(--fire);
    background:rgba(232,116,59,.08); border-radius:0 10px 10px 0; font-size:13px; line-height:1.55;}
  .card .t{font-size:10px; letter-spacing:1.3px; text-transform:uppercase; color:var(--fire);
    display:block; margin-bottom:4px;}
  .card.bad{border-left-color:var(--bad); background:rgba(201,88,74,.1);}
  .card.bad .t{color:var(--bad);}
  .stars{font-size:26px; letter-spacing:4px; color:#4a352a; margin:2px 0 6px;}
  .stars i{font-style:normal; color:var(--gold);}
  button.big{width:100%; padding:13px; margin-top:8px; border:none; border-radius:12px; cursor:pointer;
    background:linear-gradient(180deg,#e8743b,#c4552a); color:#fff; font-size:16px; font-weight:700;
    box-shadow:0 5px 0 #8e3c1c;}
  button.big:active{transform:translateY(2px); box-shadow:0 3px 0 #8e3c1c;}
  button.ghost{width:100%; padding:11px; margin-top:8px; border:1px solid var(--line); border-radius:12px;
    background:transparent; color:var(--text); font-size:14px; cursor:pointer;}
  .row2{display:flex; gap:8px;} .row2 > *{flex:1;}
  .rec{display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px dashed var(--line); font-size:13px;}
  .rec .e{font-size:19px;}
  .rec b{color:var(--sand);}
  .rec .w{color:#9c8a7b; font-size:11.5px; display:block; line-height:1.35; margin-top:2px;}
  .locked{opacity:.4;}
  #fx{position:fixed; inset:0; pointer-events:none; z-index:30;}
  .float{position:fixed; font-weight:800; font-size:22px; pointer-events:none; z-index:40;
    animation:float 1s ease-out forwards; text-shadow:0 2px 6px rgba(0,0,0,.7);}
  @keyframes float{to{transform:translateY(-46px); opacity:0;}}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div id="hudTop">
      <div class="hud-item"><span class="lbl">Čas</span><b id="time">90</b></div>
      <div class="hud-item"><span class="lbl">Skóre</span><b id="score">0</b></div>
      <div class="hud-item"><span class="lbl">Rekord</span><b id="best">0</b></div>
    </div>
    <div id="hudBottom">
      <span class="lvlchip" id="lvlchip">Kolo 1/6 · dnes</span>
      <button class="iconbtn" id="hint" title="Nápoveda (stojí 40 bodov)">💡</button>
      <button class="iconbtn" id="book" title="Receptár">📖</button>
      <button class="iconbtn" id="restart" title="Reštart kola">↺</button>
      <button class="iconbtn" id="mute" title="Zvuk">🔈</button>
    </div>
  </div>
  <div id="goal">
    <div class="ge" id="goalEmoji">🧱</div>
    <div class="gt">
      <small id="goalStep">CIEĽ</small>
      <span id="goalName">—</span>
      <em id="goalHint">—</em>
    </div>
  </div>
  <div id="toast">Ťukni na jednu vec, potom na druhú — spoja sa.</div>
  <div id="board"></div>
  <div id="hint">Číslo na surovine je jej <b>kvalita</b>. Čím čistejšia surovina, tým lepší výsledok.</div>
</div>
<div id="overlay"><div class="panel" id="panel"></div></div>
<canvas id="fx"></canvas>

<script>
(function(){
"use strict";

/* ================= VECI =================
   Všetky kombinácie zodpovedajú skutočným postupom (pokiaľ to hra dovolí).
   kvalita: true = surovina má svoju kvalitu (%), pomocné veci ju nemajú. */
var ING = {
  /* --- suroviny --- */
  hlina:  {emoji:"🟤", label:"hlína",    cls:"t-hlina",  kvalita:true},
  voda:   {emoji:"💧", label:"voda",     cls:"t-voda"},
  slama:  {emoji:"🌾", label:"slama",    cls:"t-slama"},
  piesok: {emoji:"🟨", label:"piesok",   cls:"t-piesok", kvalita:true},
  popol:  {emoji:"🌫️", label:"potaš",    cls:"t-popol",  kvalita:true},
  kamen:  {emoji:"🪨", label:"kamienok", cls:"t-kamen",  kvalita:true},
  vapenec:{emoji:"⚪", label:"vápenec",  cls:"t-vapenec",kvalita:true},
  cement: {emoji:"🥛", label:"cement",   cls:"t-cement", kvalita:true},
  uhlie:  {emoji:"⚫", label:"uhlie",    cls:"t-uhlie",  kvalita:true},
  cin:    {emoji:"🔘", label:"cín",      cls:"t-cin",    kvalita:true},
  medruda:{emoji:"🔶", label:"med. ruda",cls:"t-ruda1",  kvalita:true},
  zelruda:{emoji:"🔷", label:"žel. ruda",cls:"t-ruda2",  kvalita:true},
  /* --- krok za krokom --- */
  blato:  {emoji:"🟫", label:"blato",    cls:"t-blato"},
  cesto:  {emoji:"🟠", label:"cesto",    cls:"t-cesto"},
  kasa:   {emoji:"🥣", label:"kaša",     cls:"t-kasa"},
  malta:  {emoji:"🪣", label:"malta",    cls:"t-malta"},
  zasypcu:{emoji:"🥘", label:"med. zásyp", cls:"t-zasyp"},
  zasypfe:{emoji:"🍲", label:"žel. zásyp", cls:"t-zasyp2"},
  beton:  {emoji:"⬛", label:"betón",    cls:"t-beton"},
  zmes:   {emoji:"🟡", label:"sklár. zmes", cls:"t-zmes"},
  sklovina:{emoji:"🔵",label:"sklovina", cls:"t-sklovina"},
  vapnop: {emoji:"💨", label:"pálené vápno", cls:"t-vapno1"},
  vapnoh: {emoji:"☁️", label:"hasené vápno", cls:"t-vapno2"},
  med:    {emoji:"🟧", label:"meď",      cls:"t-med"},
  bronz:  {emoji:"🥉", label:"bronz",    cls:"t-bronz"},
  zelezo: {emoji:"🔩", label:"železo",   cls:"t-zelezo"},
  ocel:   {emoji:"⚙️", label:"oceľ",     cls:"t-ocel"},
  /* --- hotové výrobky --- */
  tehla:  {emoji:"🧱", label:"tehla",    cls:"t-tehla"},
  betonhotovy:{emoji:"⬛", label:"betón", cls:"t-beton"},
  sklo:   {emoji:"🪟", label:"sklo",     cls:"t-sklo"},
  odpad:  {emoji:"🗑️", label:"nepodarok",cls:"t-odpad"}
};

/* ================= REAKCIE =================
   Platia VŠADE rovnako — jedna fyzika pre celú hru.
   Každá dvojica, ktorá tu nie je, spraví nepodarok. */
var RECIPES = {
  "hlina+voda":   "blato",
  "blato+slama":  "cesto",
  "cement+voda":  "kasa",
  "kasa+piesok":  "malta",
  "kamen+malta":  "beton",
  "piesok+popol": "zmes",
  "vapenec+zmes": "sklovina",
  "voda+vapnop":  "vapnoh",
  "piesok+vapnoh":"malta",
  "medruda+uhlie":"zasypcu",
  "uhlie+zelruda":"zasypfe",
  "cin+med":      "bronz",
  "uhlie+zelezo": "ocel"
};
/* čo sa dá vypáliť / vytaviť / nechať vytvrdnúť */
var FIRE = {
  cesto:    "tehla",
  beton:    "betonhotovy",
  sklovina: "sklo",
  vapenec:  "vapnop",
  zasypcu:  "med",
  zasypfe:  "zelezo"
};

/* ================= KOLÁ ================= */
var LEVELS = [
  {
    cislo:1, nazov:"Tehla",
    ciel:"tehla", cielEmoji:"🧱", cas:90, hotovo:"Tehla je hotová",
    kroky:["Priprav blato — hlína + voda","Pridaj slamu — vznikne cesto","Ťukni na cesto a vypáľ tehlu"],
    poradie:["blato","cesto","tehla"],
    stol:[["hlina",94],["hlina",61],["hlina",48],["voda"],["voda"],["slama"],["slama"],["piesok",85],["popol",80]],
    popis:"Tehla drží podľa toho, akú hlinu použiješ. Kvalita sa prenáša celým postupom.",
    fakt:"Tehla = hlina + voda + slama, vypálená pri 1000 °C. Slama je výstuž, voda robí hlinu tvárnou."
  },
  {
    cislo:2, nazov:"Betón",
    ciel:"betonhotovy", cielEmoji:"⬛", cas:120, hotovo:"Betón je hotový",
    kroky:["Cement + voda = cementová kaša","Kaša + piesok = malta","Malta + kamienok = betón","Ťukni na betón — nechaj vytvrdnúť"],
    poradie:["kasa","malta","beton","betonhotovy"],
    stol:[["cement",92],["cement",60],["voda"],["voda"],["piesok",88],["piesok",55],["kamen",90],["kamen",70],["popol",75]],
    popis:"Betón je zmes cementu, piesku a kamienka. Každá zložka musí byť dobrá, inak betón praskne.",
    fakt:"Betón tvrdne chemicky — cement reaguje s vodou celé týždne, nie že by len 'vyschol'."
  },
  {
    cislo:3, nazov:"Sklo",
    ciel:"sklo", cielEmoji:"🪟", cas:130, hotovo:"Sklo je hotové",
    kroky:["Piesok + potaš = sklárna zmes","Pridaj vápenec — vznikne sklovina","Ťukni na sklovinu a vypáľ sklo"],
    poradie:["zmes","sklovina","sklo"],
    stol:[["piesok",95],["piesok",70],["piesok",50],["popol",90],["popol",60],["vapenec",85],["vapenec",55],["hlina",70],["kamen",80]],
    popis:"Sklo sú tri veci: piesok (sklo samo), potaš (zníži teplotu) a vápenec (aby vydržalo).",
    fakt:"Bez vápenca by bolo sklo rozpustné vo vode — také sklo by na okno nešlo."
  },
  {
    cislo:4, nazov:"Vápno a malta",
    ciel:"malta", cielEmoji:"🪣", cas:130, hotovo:"Malta je hotová",
    kroky:["Ťukni na vápenec a vypáľ ho na pálené vápno","Pálené vápno + voda = hasené vápno","Hasené vápno + piesok = malta"],
    poradie:["vapnop","vapnoh","malta"],
    stol:[["vapenec",93],["vapenec",62],["voda"],["voda"],["piesok",88],["piesok",55],["hlina",60],["popol",70],["kamen",80]],
    popis:"Vápno je základ starých stavieb. Páli sa z vápenca a hasí vodou.",
    fakt:"Hasenie vápna sa zahreje na vyše 100 °C — voda v zmesi vrie. Preto sa hasí opatrne a v malom."
  },
  {
    cislo:5, nazov:"Bronz",
    ciel:"bronz", cielEmoji:"🥉", cas:130, hotovo:"Bronz je hotový",
    kroky:["Medená ruda + uhlie = zásyp do pece","Ťukni na zásyp a vytav meď","Meď + cín = bronz"],
    poradie:["zasypcu","med","bronz"],
    stol:[["medruda",92],["medruda",58],["uhlie",90],["uhlie",70],["cin",95],["cin",60],["piesok",80],["voda"],["kamen",75]],
    popis:"Kov sa z rudy nedá vybrať len tak — uhlie v peci mu vezme kyslík a zostane čistý kov.",
    fakt:"Bronz je tvrdší ako meď aj cín samotné. Preto sa z neho robili nástroje — celá bronzová doba."
  },
  {
    cislo:6, nazov:"Oceľ",
    ciel:"ocel", cielEmoji:"⚙️", cas:130, hotovo:"Oceľ je hotová",
    kroky:["Železná ruda + uhlie = zásyp do pece","Ťukni na zásyp a vytav železo","Železo + uhlie = oceľ"],
    poradie:["zasypfe","zelezo","ocel"],
    stol:[["zelruda",94],["zelruda",66],["uhlie",92],["uhlie",65],["hlina",70],["vapenec",75],["piesok",80],["voda"],["kamen",72]],
    popis:"Železo sa taví oveľa vyššie ako meď. Až vysoké pece spravili z železa bežný kov.",
    fakt:"Oceľ = železo + 0,2 až 2 % uhlíka. Viac uhlíka = tvrdšie, ale krehkejšie."
  }
];

/* receptár — čo všetko sa dá objaviť a čo to znamená vo fyzike */
var RECEPTAR = {
  "hlina+voda":{vysl:"blato", text:"Suchá hlina sa rozsype. Voda z nej spraví tvárnu hmotu, ktorá drží tvar."},
  "blato+slama":{vysl:"cesto", text:"Slama je výstuž — drží tehlu pokope, aby pri sušení nepraskla. Dnešná obdoba je armovacia sieť v betóne."},
  "cesto->tehla":{vysl:"tehla", text:"Vypálením pri ~1000 °C sa hlina zmení na keramiku: tvrdú a nerozpustnú vo vode."},

var actx = null;
function initAudio(){ if(actx) return; try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; } }
function sfx(freq, dur, type, vol){
  if(muted || !actx) return;
  try{
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type||"sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(vol||0.12, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
  }catch(e){}
}
function sfxMerge(){ sfx(520,0.09,"triangle",0.10); setTimeout(function(){sfx(790,0.11,"triangle",0.09);},70); }

function key(a,b){ return a<b ? a+"+"+b : b+"+"+a; }
/* Dvojicu vždy zoradíme podľa abecedy — inak by sa recept
   "malta+kamen" nenašiel, keď hráč spojí kamienok s maltou. */
function normKey(k){
  var p = k.split("+");
  if(p.length !== 2) return k;                 /* kľúče typu "cesto->tehla" nemenia */
  return p[0] < p[1] ? p[0]+"+"+p[1] : p[1]+"+"+p[0];
}
function normTable(o){ var m = {}, k; for(k in o) m[normKey(k)] = o[k]; return m; }
ZLE = normTable(ZLE);
RECIPES = normTable(RECIPES);
RECEPTAR = normTable(RECEPTAR);
function shuffle(arr, rnd){
  for(var i=arr.length-1;i>0;i--){ var j=Math.floor(rnd()*(i+1)); var t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
  return arr;
}

function floatText(txt, color){

function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

var cellEls = [], tileEls = [], boardSize = 9;

function buildBoard(n){
  boardSize = n;
  var cols = n<=9 ? 3 : 4;
  boardEl.style.gridTemplateColumns = "repeat("+cols+",1fr)";
  boardEl.style.gridTemplateRows = "repeat("+Math.ceil(n/cols)+",1fr)";
  boardEl.innerHTML = ""; cellEls = []; tileEls = [];
  for(var i=0;i<n;i++){
    var cell = document.createElement("div");
    cell.className = "cell empty"; cell.dataset.i = i;
    boardEl.appendChild(cell); cellEls.push(cell); tileEls.push(null);
  }
}
function tileKey(t){ return t ? (t.type + "|" + (t.q==null?"-":t.q)) : null; }
function paint(){
  for(var i=0;i<boardSize;i++){
    var t = tiles[i], cell = cellEls[i], tile = tileEls[i];
    if(!cell) continue;
    if(selected===i) cell.classList.add("sel"); else cell.classList.remove("sel");
    if(!t){
      cell.classList.add("empty");
      if(tile){ tile.remove(); tileEls[i] = null; }
      continue;
    }
    cell.classList.remove("empty");
    if(!tile || tile.dataset.key !== tileKey(t)){
      if(tile) tile.remove();
      tile = document.createElement("div");
      tile.className = "tile " + ING[t.type].cls;
      tile.dataset.key = tileKey(t);
      tile.innerHTML = ING[t.type].emoji + "<span>" + ING[t.type].label + "</span>" +
        (t.q!=null ? '<i>'+t.q+'</i>' : '');
      cell.appendChild(tile); tileEls[i] = tile;
    }
    if(lvl && FIRE[t.type]) cell.classList.add("fireable");
    else cell.classList.remove("fireable");
  }
}
function bump(i){
  var tile = tileEls[i]; if(!tile) return;
  tile.classList.remove("bump"); void tile.offsetWidth; tile.classList.add("bump");
}
function hud(){
  $("score").textContent = score;
  $("best").textContent = best;
  $("time").textContent = timeLeft;
  $("time").className = (timeLeft<=10 ? "low" : "");
}
function goal(){
  $("goalEmoji").textContent = lvl.cielEmoji;
  $("goalName").textContent = "Vyrob: " + ING[lvl.ciel].label;
  var txt;
  if(hints > 0 && lvl.kroky[hints-1]) txt = "Nápoveda " + hints + ": " + lvl.kroky[hints-1];
  else txt = progressTxt() || "Postup (z čoho sa to skladá) si musíš nájsť sám.";

}
/* čo už hráč na stole vyrobil — bez toho, aby sme mu prezradili recept */
function progressTxt(){
  var last = null;
  for(var i=0;i<lvl.poradie.length-1;i++){
    for(var j=0;j<tiles.length;j++) if(tiles[j] && tiles[j].type === lvl.poradie[i]) last = lvl.poradie[i];
  }
  return last ? "Zatiaľ máš: " + ING[last].label + ". Čo s tým ďalej?" : "";
}
function render(){ paint(); hud(); goal(); }

/* ================= KVALITA ================= */
function kvalita(vstup){
  var q = [], i;
  for(i=0;i<vstup.length;i++) if(vstup[i] && vstup[i].q!=null) q.push(vstup[i].q);
  if(!q.length) return null;
  var s = 0; for(i=0;i<q.length;i++) s += q[i];
  return Math.round(s/q.length);
}

/* ================= ŤUKNUTIE ================= */
function tap(i){
  if(!running) return;
  var t = tiles[i];

  if(!t){
    if(selected!==null && tiles[selected]){
      tiles[i] = tiles[selected]; tiles[selected] = null; selected = null;
      sfx(430,0.05,"sine",0.05); paint(); return;
    }
    selected = null; paint(); return;
  }

  if(t.type === "odpad"){ toast("Toto je nepodarok — nedá sa použiť.", "bad"); return; }

  if(selected === null){
    selected = i; paint();
    if(FIRE[t.type]) toast("Vybraté — ťukni naň ešte raz a spustíš pec (🔥).", "");
    return;
  }

  if(selected === i){
    if(FIRE[t.type]) fire(i);
    else { selected = null; paint(); }
    return;
  }

  /* máme vybraté jednu vec a ťukáme na druhú */
  var maRecept = !!RECIPES[key(tiles[selected].type, t.type)];
  if(!maRecept && FIRE[t.type]){
    /* na vypáliteľnú vec sa neútočí — radšej ju len vyberieme */
    selected = i; paint();
    toast("Vybraté — ťukni naň ešte raz a spustíš pec (🔥).", "");
    return;
  }
  combine(selected, i);
}

function combine(a,b){
  var x = tiles[a], y = tiles[b];
  selected = null;
  if(!x || !y){ paint(); return; }
  var k = key(x.type, y.type);
  var res = RECIPES[k];

  if(res){
    var q = kvalita([x,y]);
    tiles[a] = {type:res, q:q}; tiles[b] = null;
    var jeNovy = recUnlock(k);
    levelScore += 25;
    sfxMerge();
    toast(ING[x.type].label + " + " + ING[y.type].label + " = " + ING[res].label +
          (q!=null ? "  · kvalita " + q + " %" : "") + (jeNovy ? "  📖 nové!" : ""), "good");
    paint(); bump(a);
    if(res === lvl.ciel){ completeLevel(res, q); return; }
    goal();
    return;
  }

  tiles[a] = {type:"odpad"}; tiles[b] = null;
  badMerge(k, x, y);
}

/* ================= DÁ SA EŠTE CIEĽ VYROBIŤ? =================
   Po každej zlej zmesi hra prezradí, či sú ešte na stole suroviny na cieľ.
   Ak nie, kolo sa nedá dokončiť a treba reštart. */
function pocet(){
  var c = {}, i, t;
  for(i=0;i<tiles.length;i++){ t = tiles[i]; if(t && t.type !== "odpad") c[t.type] = (c[t.type]||0)+1; }
  return c;
}
function kopiruj(c){ var o = {}, k; for(k in c) o[k] = c[k]; return o; }
function spravit(typ, c){
  if((c[typ]||0) > 0){ var r = kopiruj(c); r[typ]--; return r; }
  var f;
  for(f in FIRE){ if(FIRE[f] === typ){ var rt = spravit(f, c); if(rt) return rt; } }
  for(var key in RECIPES){
    if(RECIPES[key] === typ){
      var p = key.split("+");
      var a = spravit(p[0], c);
      if(a){ var b = spravit(p[1], a); if(b) return b; }
    }
  }
  return null;
}
function daSaDokoncit(){ return spravit(lvl.ciel, pocet()) !== null; }

function badMerge(k, x, y){
  levelScore -= 15; badMerges++;
  sfxBad();
  paint();
  boardEl.classList.add("shake");
  setTimeout(function(){ boardEl.classList.remove("shake"); }, 420);
  var popis = zlaVeta(k);
  var kto = ING[x.type].label + " + " + ING[y.type].label;

  if(daSaDokoncit()){
    /* o dve suroviny menej, ale cieľ sa ešte dá vyrobiť — hra pokračuje */
    toast("Zlá zmes: " + kto + " = nepodarok. " + popis + " O dve suroviny menej — ešte to vieš dokončiť.", "bad");
    goal();
  }else{
    lost = true; running = false;
    clearInterval(tickTimer);
    toast("Zlá zmes: " + kto + " — a na cieľ už materiál nemáš.", "bad");
    setTimeout(function(){ showLost(x.type, y.type, popis); }, 900);
  }
}

/* ================= VYPÁLENIE / DOKONČENIE ================= */
/* spoločné dokončenie kola — používa ho vypálenie aj posledné spojenie */
function completeLevel(outType, q){
  if(!running) return;
  finalQ = (q!=null ? q : 100);
  stars = starsFor(finalQ);
  if(hints > 0 && stars > 2) stars = 2;
  solved = true; running = false;
  clearInterval(tickTimer);
  levelScore += finalQ*10 + timeLeft*2 - (attempt-1)*50 - hints*40;
  if(levelScore < 50) levelScore = 50;
  score = levelScore;
  saveBest(score);
  best = loadBest();
  sfxFire();
  floatText("+" + levelScore, "#8fbf5a");
  render();
  finalScene(outType, finalQ, function(){ showWin(); });
}

function fire(i){
  if(!running) return;
  var t = tiles[i];
  var hotovo = FIRE[t.type];
  if(!hotovo) return;
  selected = null;                 /* nič nesmie zostať vybraté */
  var q = (t.q!=null ? t.q : 100);
  var outType = (hotovo === "betonhotovy") ? "beton" : hotovo;

  recUnlock(t.type + "->" + hotovo);
  if(t.type === "beton") toast("Betón vytvrdol — kvalita " + q + " %.", "good");
  else toast(ING[outType].label + " je na svete · kvalita " + q + " %", "good");

  if(hotovo === lvl.ciel){
    /* vznikol hotový výrobok kola */
    tiles[i] = null;
    paint(); goal();
    completeLevel(outType, q);
  }else{
    /* medzivýrobok ostáva na stole, aby sa dal ďalej spracovať */
    tiles[i] = {type:hotovo, q:q};
    paint(); bump(i); goal();
  }
}

/* ================= KOLO ================= */
function layoutFor(level){
  var rnd = mulberry(dayNumber() + level.cislo*7919);
  var stol = shuffle(level.stol.slice(), rnd);
  return stol.map(function(item){
    var o = {type:item[0]};
    if(item.length > 1){
      var jitter = Math.round((rnd()-0.5)*6);          /* ±3 % podľa dňa */
      o.q = Math.max(20, Math.min(99, item[1] + jitter));
    }
    return o;
  });
}

function startLevel(){
  tiles = layoutFor(lvl);
  buildBoard(tiles.length);
  selected = null; lost = false; solved = false; running = true;
  levelScore = 0; timeLeft = lvl.cas; hints = 0; revealed = []; badMerges = 0;
  score = 0; best = loadBest();
  toast("Vyrob " + lvl.ciel + ". Z čoho? To si musíš prísť sám.", "");
  render();
  $("overlay").classList.add("hidden");
  clearInterval(tickTimer);
  tickTimer = setInterval(function(){
    if(!running) return;
    timeLeft--; hud();
    if(timeLeft <= 0) timeUp();
  }, 1000);
}
function restartLevel(voluntary){
  attempt++;
  startLevel();
  if(voluntary) toast("Nový pokus — stôl je nasypaný odznova.", "");
}
function timeUp(){
  running = false; lost = true;
  clearInterval(tickTimer);
  sfxBad();
  showLost(null, null, null, true);
}

/* ================= SKÚŠKA NA KONCI ================= */
function finalScene(outType, q, done){
  var cv = $("fx"), ctx = cv.getContext("2d");
  var W = cv.width = window.innerWidth, H = cv.height = window.innerHeight;
  var t0 = performance.now(), finished = false;
  var groundY = H*0.42;
  var b = { x: W/2 - 36, y: -60, w: 72, h: 30, rot: (Math.random()-0.5)*0.12, vy: 0, landed: false, cracked: q < 55 };
  function finish(){ if(finished) return; finished = true; try{ ctx.clearRect(0,0,W,H); }catch(e){} done(); }
  setTimeout(finish, 4500);
  function step(){
    var el = performance.now() - t0;
    ctx.clearRect(0,0,W,H);
    if(!b.landed){ b.vy += 0.9; b.y += b.vy; if(b.y >= groundY){ b.y = groundY; b.landed = true; } }
    if(el > 250){
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot);
      if(b.cracked){
        ctx.fillStyle = "#5a4038"; ctx.fillRect(0,0,b.w,b.h);
        ctx.fillStyle = "#2b1f18"; ctx.fillRect(b.w*0.35,0,4,b.h); ctx.fillRect(b.w*0.62,0,3,b.h);
      }else{
        var g = ctx.createLinearGradient(0,0,0,b.h);
        g.addColorStop(0,"#c07a4c"); g.addColorStop(1,"#8e4f2b");
        ctx.fillStyle = g; ctx.fillRect(0,0,b.w,b.h);
        ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.lineWidth = 1.5; ctx.strokeRect(0.5,0.5,b.w-1,b.h-1);
      }
      ctx.restore();
    }
    if(b.landed && el > 900){ setTimeout(finish, 300); return; }
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ================= ZDIEĽANIE (denná zákazka) ================= */
function shareText(){
  var hodn = "★".repeat(stars) + "☆".repeat(3-stars);
  return "Dielnička #" + Math.floor(dayNumber()%1000) + " — " + lvl.nazov +
    "\nKvalita " + finalQ + " %  " + hodn + "\nSkóre " + score + " · pokusov " + attempt +
    "\nZvládneš lepšie?";
}
function share(){
  var text = shareText();
  if(navigator.share){
    navigator.share({text:text}).catch(function(){});
    return;
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast("Skopírované — pošli to kamarátovi.", "good"); },
      function(){ toast("Text je v poli nižšie.", ""); showShareBox(text); });
    return;
  }
  showShareBox(text);
}
function showShareBox(text){
  var box = document.createElement("textarea");
  box.value = text; box.style.cssText = "width:100%;height:74px;margin-top:8px;background:#221810;color:#f0e3d3;border:1px solid #4a352a;border-radius:10px;padding:8px;font-size:13px;";
  var p = $("panel"); p.appendChild(box); box.select();
}

/* ================= OBRAZOVKY ================= */
function showWin(){
  sfxWin();
  var f = lvl.fakt;
  var casBonus = timeLeft*2, pokuta = (attempt-1)*50;
  var popis = finalQ>=90 ? "Pevný kus — materiál bol čistý."
            : finalQ>=75 ? "Dobrý kus, ale materiál mohol byť lepší."
            : finalQ>=55 ? "Drobí sa. Použil si slabšiu surovinu."
            : "Rozpadol sa — materiál bol príliš slabý.";
  if(hints) popis += " Použil si nápovedu, takže najviac dve hviezdy.";
  $("panel").innerHTML =
    '<h2>' + lvl.cielEmoji + ' ' + (lvl.hotovo || lvl.nazov) + '</h2>' +
    '<div class="sub">Kolo ' + lvl.cislo + ' · pokusov: ' + attempt + ' · dnes pre všetkých rovnaký stôl</div>' +
    '<div class="stars">' + starStr(stars) + '</div>' +
    '<div class="kv"><span>Kvalita</span><b>' + finalQ + ' %</b></div>' +
    '<div class="kv"><span>Za kvalitu</span><b>+' + (finalQ*10) + '</b></div>' +
    '<div class="kv"><span>Zvyšný čas (' + timeLeft + ' s × 2)</span><b>+' + casBonus + '</b></div>' +
    (pokuta ? '<div class="kv"><span>Za ' + (attempt-1) + '× reštart</span><b>−' + pokuta + '</b></div>' : '') +
    (hints ? '<div class="kv"><span>Nápovedy (' + hints + '× 40)</span><b>−' + (hints*40) + '</b></div>' : '') +
    (badMerges ? '<div class="kv"><span>Zré zmesi (' + badMerges + '× 15)</span><b>−' + (badMerges*15) + '</b></div>' : '') +
    '<div class="kv total"><span>Skóre</span><b>' + levelScore + '</b></div>' +
    '<div class="card"><span class="t">Prečo práve takto</span>' + popis + ' ' + f + '</div>' +
    '<div class="card"><span class="t">Receptár</span>Objavené postupy: <b>' + recCount() + '/' + recTotal() + '</b></div>' +
    '<button class="big" id="nextlv">' + (lvl.cislo < LEVELS.length ? 'Ďalšie kolo →' : 'Skúsiť znova') + '</button>' +
    '<div class="row2" style="margin-top:8px">' +
      '<button class="ghost" id="sharebtn">📤 Zdieľať</button>' +
      '<button class="ghost" id="bookbtn">📖 Receptár</button>' +
    '</div>';
  $("overlay").classList.remove("hidden");
  $("sharebtn").onclick = function(){ share(); };
  $("bookbtn").onclick = function(){ showBook(function(){ showWin(); }); };
  $("nextlv").onclick = function(){
    if(lvl.cislo < LEVELS.length){
      setUnlocked(lvl.cislo+1);
      lvl = LEVELS[lvl.cislo];
      attempt = 1; initAudio(); startLevel();
    }else{
      attempt = 1; initAudio(); startLevel();
    }
  };
}

function showLost(a, b, popis, timeOut){
  var telo, rada;
  if(timeOut){
    telo = 'Čas vypršal, kým si prišiel na to, z čoho sa <b>' + lvl.ciel + '</b> skladá.';
    rada = 'Na stole je viac surovín, než treba. Najprv si v hlave povedz, čo všetko by ' + lvl.ciel + ' potreboval.';
  }else{
    telo = 'Spojil si <b>' + ING[a].label + ' + ' + ING[b].label + '</b> — vznikol nepodarok a tie dve suroviny sú preč. Na <b>' + lvl.ciel + '</b> už na stole nemáš čo použiť, takže kolo sa dokončiť nedá. <br><br>' + popis;
    rada = 'Zlá zmes sa nedá vrátiť. Nabudúce si najprv premysli, ktoré dve veci k sebe patria — alebo si vezmi 💡 nápovedu (stojí body, ale posunie ťa).';
  }
  $("panel").innerHTML =
    '<h2 class="lost">' + (timeOut ? '⏱ Čas vypršal' : '✖ Kolo je stratené') + '</h2>' +
    '<div class="sub">Kolo ' + lvl.cislo + ' · ' + lvl.nazov + ' · pokus ' + attempt + '</div>' +
    '<div class="card bad"><span class="t">' + (timeOut ? 'Prečo' : 'Zlý postup') + '</span>' + telo + '</div>' +
    '<div class="card"><span class="t">Rada</span>' + rada + '</div>' +
    '<button class="big" id="retry">Spustiť kolo znova</button>' +
    '<button class="ghost" id="bookbtn">📖 Receptár</button>';
  $("overlay").classList.remove("hidden");
  $("retry").onclick = function(){ initAudio(); restartLevel(true); };
  $("bookbtn").onclick = function(){ showBook(function(){ showLost(a,b,popis,timeOut); }); };
}

function showBook(back){
  var r = recLoad(), html = "", k, item, pair, e1, e2, vysl;
  html += '<h2>📖 Receptár</h2><div class="sub">Objavené: ' + recCount() + ' / ' + recTotal() + '</div>';
  /* postupy */
  for(k in RECEPTAR){
    item = RECEPTAR[k]; pair = k.split("+");
    if(pair.length === 2 && ING[pair[0]] && ING[pair[1]]){
      e1 = ING[pair[0]].emoji; e2 = ING[pair[1]].emoji;
    }else{
      pair = k.split("->"); e1 = "🔥"; e2 = ING[pair[0]] ? ING[pair[0]].emoji : "?";
    }
    vysl = ING[item.vysl] ? ING[item.vysl].emoji + " " + ING[item.vysl].label : item.vysl;
    if(r[k]){
      html += '<div class="rec"><div class="e">' + e1 + ' + ' + e2 + ' → ' + vysl + '</div>' +
              '<div><b>' + (ING[item.vysl]?ING[item.vysl].label:item.vysl) + '</b><span class="w">' + item.text + '</span></div></div>';
    }else{
      html += '<div class="rec locked"><div class="e">❔ + ❔ → ❔</div><div><b>Zatiaľ neobjavené</b>' +
              '<span class="w">Vyskúšaj niečo nové na stole.</span></div></div>';
    }
  }
  html += '<button class="big" id="bookback">Späť do hry</button>';
  $("panel").innerHTML = html;
  $("overlay").classList.remove("hidden");
  $("bookback").onclick = function(){ if(back) back(); else startLevel(); };
}

function showIntro(){
  $("panel").innerHTML =
    '<h1>🧱 Dielnička</h1>' +
    '<div class="sub">6 kôl: tehla, betón, sklo, vápno, bronz a oceľ.</div>' +
    '<ul class="rules">' +
      '<li>Zadanie ti povie len <b>čo vyrobiť</b>. <b>Ako</b> — to si musíš prísť sám.</li>' +
      '<li>Na stole máš suroviny. <b>Nie všetky potrebuješ</b> a niektoré vyzerajú podobne.</li>' +
      '<li>Každá surovina má <b>kvalitu v percentách</b>. Z dobrého materiálu je dobrá vec.</li>' +
      '<li><b>Zlá zmes zožerie dve suroviny.</b> Kým sa cieľ dá ešte vyrobiť, hra pokračuje — keď nie, kolo treba spustiť znova.</li>' +
      '<li>💡 <b>Nápoveda</b> ti poradí ďalší krok, ale stojí 40 bodov a uberie hviezdu.</li>' +
      '<li>Postupy sú <b>zo skutočnej fyziky a chémie</b> a platia všade rovnako.</li>' +
      '<li>Stôl je <b>každý deň iný a pre všetkých rovnaký</b> — môžeš súperiť s kamarátom.</li>' +
    '</ul>' +
    '<button class="big" id="play">Začať hru</button>' +
    '<button class="ghost" id="bookbtn">📖 Receptár (' + recCount() + '/' + recTotal() + ')</button>';
  $("overlay").classList.remove("hidden");
  $("play").onclick = function(){ initAudio(); startLevel(); };
  $("bookbtn").onclick = function(){ showBook(function(){ showIntro(); }); };
}

/* ================= OVLÁDANIE ================= */
boardEl.addEventListener("pointerup", function(e){
  var el = e.target.closest ? e.target.closest(".cell") : null;
  if(!el) return;
  e.preventDefault();
  tap(Number(el.dataset.i));
});
boardEl.addEventListener("pointerdown", function(e){ e.preventDefault(); });
boardEl.addEventListener("touchstart", function(e){ e.preventDefault(); }, {passive:false});
$("mute").addEventListener("click", function(){ muted = !muted; $("mute").textContent = muted ? "🔇" : "🔈"; });
$("restart").addEventListener("click", function(){ if(running || lost){ initAudio(); restartLevel(true); } });
$("book").addEventListener("click", function(){ showBook(function(){ if(running) render(); else startLevel(); }); });
$("hint").addEventListener("click", function(){
  if(!running) return;
  if(hints >= lvl.kroky.length){ toast("Ďalšiu nápovedu už nemám — celý postup ti hovorím.", ""); return; }
  hints++;
  levelScore -= 40;
  toast("Nápoveda " + hints + " (−40 bodov): " + lvl.kroky[hints-1], "");
  goal();
});

/* ladenie / testovanie */
window.DIELNICKA = {
  get: function(){
    return {kolo:lvl.cislo, ciel:lvl.ciel, tiles:tiles, selected:selected, running:running, lost:lost, solved:solved,
            timeLeft:timeLeft, levelScore:levelScore, score:score, badMerges:badMerges, hints:hints,
            daSaDokoncit:daSaDokoncit(), best:best, attempt:attempt, kvalita:finalQ, stars:stars, receptar:recLoad()};
  },
  tap: function(i){ tap(i); },
  set: function(i,type,q){ tiles[i] = type ? {type:type, q:(q==null?null:q)} : null; render(); },
  start: function(){ initAudio(); attempt = 1; startLevel(); },
  goto: function(n){ lvl = LEVELS[Math.max(0, Math.min(LEVELS.length-1, n-1))]; attempt = 1; initAudio(); startLevel(); },
  restart: function(){ restartLevel(true); },
  nextLevel: function(){ setUnlocked(lvl.cislo+1); lvl = LEVELS[Math.min(lvl.cislo, LEVELS.length-1)]; attempt=1; startLevel(); },
  shareText: function(){ return shareText(); },
  layoutFor: function(n){ return layoutFor(LEVELS[n-1]); }
};

/* ================= ŠTART ================= */
attempt = 1; tiles = []; selected = null; running = false; lost = false; solved = false;
timeLeft = LEVELS[0].cas; levelScore = 0; finalQ = 0; stars = 0;
lvl = LEVELS[Math.min(unlocked(), LEVELS.length) - 1];
buildBoard(9);
render();
showIntro();

})();
</script>
